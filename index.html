<!DOCTYPE html>
<html lang="pt-BR" <head>
<meta charset="UTF-8" />
<title>Calculadora da Hello Kitty</title>
<link rel="stylesheet" href="style.css" </head>

<body>
    <div class="container">
        <img src="hellokitty.png" alt="Hello Kitty" class="hello-img" />
        <button id="toggle-dark" onclick="toggleDarkMode()">🌙 Dark Mode</button>
        <h1>Calculadora Hello Kitty</h1>
        <div class="calculadora">
            <input type="text" class="display" id="display" disabled />
            <div class="botoes">
                <button onclick="press('7')">7</button>
                <button onclick="press('8')">8</button>
                <button onclick="press('9')">9</button>
                <button onclick="press('/')">÷</button>
                <button onclick="press('4')">4</button>
                <button onclick="press('5')">5</button>
                <button onclick="press('6')">6</button>
                <button onclick="press('*')">x</button>
                <button onclick="press('1')">1</button>
                <button onclick="press('2')">2</button>
                <button onclick="press('3')">3</button>
                <button onclick="press('-')">-</button>
                <button onclick="press('0')">0</button>
                <button onclick="press('.')">.</button>
                <button onclick="clearDisplay()">C</button>
                <button onclick="press('+')">+</button>
                <button class="igual" onclick="calculate()">=</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>


</body>

</html>
